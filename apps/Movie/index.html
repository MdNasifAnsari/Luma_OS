<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101010">
    <title>Reel Room — Your movie night starts here</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="welcome-page">
    <main class="welcome">
      <a class="wordmark" href="index.html" aria-label="Reel Room home">
        <span class="wordmark-icon" aria-hidden="true">R</span>
        <span>REEL ROOM</span>
      </a>

      <div class="welcome-copy">
        <p class="eyebrow"><span class="eyebrow-line"></span></p>
        <h1>Good stories.<br><span>One click away.</span></h1>
        <p class="welcome-description">
          Pick a film, get comfortable, and let movie night take it from here.
        </p>
        <a class="button button-primary watch-button" href="movie.html">
          Watch <span aria-hidden="true">→</span>
        </a>
      </div>

      <div class="welcome-art" aria-hidden="true">
        <div class="art-glow"></div>
        <div class="film-frame film-frame-back"><span>R</span></div>
        <div class="film-frame film-frame-front"><span>PLAY</span></div>
        <span class="art-star star-one">✳</span>
        <span class="art-star star-two">✳</span>
      </div>

      <p class="welcome-footer">A LITTLE ESCAPE, RIGHT AT HOME <span>©</span></p>
    </main>
  </body>
</html>
