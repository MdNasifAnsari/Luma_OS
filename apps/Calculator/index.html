<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>

<style>
    * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        background: linear-gradient(150deg, #022c22, #064e3b, #020617);
        font-family: Arial, sans-serif;
        color: white;
    }

    .container {
        width: 100%;
        height: 75vh;
        padding: 30px 15px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }



    body.light {
        background: linear-gradient(150deg, #dbeafe, #f0fdf4, #e2e8f0);
        color: #020617;
    }


    .display {
        margin-top: 100px;
        position: relative;
        margin-bottom: 15px;
        width: 300px;
    }

    .display input {
        width: 100%;
        height: 70px;
        border: none;
        border-radius: 12px;
        outline: none;
        padding: 10px 15px;
        background: rgba(255, 255, 255, 0.92);
        color: #020617;
        font-size: 27px;
        text-align: right;
    }

    .display button {
        position: absolute;
        right: 8px;
        bottom: 8px;
        height: 25px;
        padding: 0 8px;
        border: none;
        border-radius: 6px;
        background: #064e3b;
        color: white;
        font-size: 11px;
        cursor: pointer;
    }

    .button {
        display: flex;
        justify-content: center;
    }

    .button input {
        width: 65px;
        height: 65px;
        margin: 5px;
        border: none;
        border-radius: 50%;
        font-size: 19px;
        cursor: pointer;
        outline: none;
        -webkit-tap-highlight-color: transparent;
        transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }


    .button input:active,
    .button input.keyboard-active {
        transform: scale(0.92);
        box-shadow:
            0 2px 6px rgba(0, 0, 0, 0.45),
            0 0 10px rgba(52, 211, 153, 0.3);
    }


    .last-row input:last-child {
        width: 145px;
        border-radius: 20px;
    }
</style>

<body>

    <div class="container">
        <div class="calculator">

            <div class="display">
                <input class="m_display" type="text" readonly>
            </div>

            <div class="button">
                <input type="button" value="AC" data-action="clear">
                <input type="button" value="Del" data-action="delete">
                <input type="button" value="." data-value=".">
                <input type="button" value="/" data-value="/">
            </div>

            <div class="button">
                <input type="button" value="7" data-value="7">
                <input type="button" value="8" data-value="8">
                <input type="button" value="9" data-value="9">
                <input type="button" value="x" data-value="*">
            </div>

            <div class="button">
                <input type="button" value="4" data-value="4">
                <input type="button" value="5" data-value="5">
                <input type="button" value="6" data-value="6">
                <input type="button" value="-" data-value="-">
            </div>

            <div class="button">
                <input type="button" value="1" data-value="1">
                <input type="button" value="2" data-value="2">
                <input type="button" value="3" data-value="3">
                <input type="button" value="+" data-value="+">
            </div>

            <div class="button last-row">
                <input type="button" value="00" data-value="00">
                <input type="button" value="0" data-value="0">
                <input type="button" value="=" data-action="calculate">
            </div>

        </div>

    </div>


</body>

<script>
    const display = document.querySelector(".m_display");
    const buttons = document.querySelectorAll(".button input");
    let justCalculated = false;

    function animateButton(button) {
        if (!button) return;

        button.classList.remove("keyboard-active");
        void button.offsetWidth;
        button.classList.add("keyboard-active");
        setTimeout(() => button.classList.remove("keyboard-active"), 150);
    }

    function addValue(value) {
        if (justCalculated && /[\d.]/.test(value)) display.value = "";
        display.value += value;
        justCalculated = false;
    }

    function clearDisplay() {
        display.value = "";
        justCalculated = false;
    }

    function deleteValue() {
        display.value = display.value.slice(0, -1);
        justCalculated = false;
    }

    function evaluateExpression(expression) {
        const tokens = expression.match(/(?:\d+(?:\.\d*)?|\.\d+)|[()+\-*/]/g) || [];
        if (tokens.join("") !== expression) throw new Error("Invalid expression");

        let position = 0;

        function parsePrimary() {
            const token = tokens[position++];
            if (token === "(") {
                const value = parseExpression();
                if (tokens[position++] !== ")") throw new Error("Missing closing parenthesis");
                return value;
            }
            if (token === undefined || !/^\d|^\./.test(token)) throw new Error("Expected a number");
            return Number(token);
        }

        function parseUnary() {
            if (tokens[position] === "+") {
                position++;
                return parseUnary();
            }
            if (tokens[position] === "-") {
                position++;
                return -parseUnary();
            }
            return parsePrimary();
        }

        function parseTerm() {
            let value = parseUnary();
            while (["*", "/"].includes(tokens[position])) {
                const operator = tokens[position++];
                const next = parseUnary();
                value = operator === "*" ? value * next : value / next;
            }
            return value;
        }

        function parseExpression() {
            let value = parseTerm();
            while (["+", "-"].includes(tokens[position])) {
                const operator = tokens[position++];
                const next = parseTerm();
                value = operator === "+" ? value + next : value - next;
            }
            return value;
        }

        const result = parseExpression();
        if (position !== tokens.length || !Number.isFinite(result)) throw new Error("Invalid expression");
        return result;
    }

    function calculate() {
        if (!display.value.trim()) return;

        try {
            display.value = String(Number(evaluateExpression(display.value).toFixed(5)));
            justCalculated = true;
        } catch {
            display.value = "Error";
            justCalculated = true;
        }
    }

    buttons.forEach((button) => {
        button.addEventListener("click", () => {
            const { value, action } = button.dataset;

            if (value !== undefined) addValue(value);
            if (action === "clear") clearDisplay();
            if (action === "delete") deleteValue();
            if (action === "calculate") calculate();
        });
    });

    document.addEventListener("keydown", (event) => {
        const { key } = event;
        let button;

        if (/^[0-9.]$/.test(key) || ["+", "-", "*", "/", "(", ")"].includes(key)) {
            addValue(key);
            button = [...buttons].find((item) => item.dataset.value === key);
        } else if (key === "Enter" || key === "=") {
            event.preventDefault();
            calculate();
            button = [...buttons].find((item) => item.dataset.action === "calculate");
        } else if (key === "Backspace" || key === "Delete") {
            deleteValue();
            button = [...buttons].find((item) => item.dataset.action === "delete");
        } else if (key === "Escape") {
            clearDisplay();
            button = [...buttons].find((item) => item.dataset.action === "clear");
        }

        animateButton(button);
    });

</script>

</html>
